    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        body{
            justify-content: center;
            background-color: aliceblue;
            display:flow-root;
            align-items: center;
        }
        #ul1{
            background-color: rgb(190, 224, 238);
            width: 200px;
            height: 180px;
            box-shadow: 50px;
            padding: 15px;
        }
        
        #ol1{
            background-color: rgb(42, 206, 184);
            width: 200px;
            height: 200px;
            box-shadow: 50px;

        }

        #di1{

            background-color: rgb(118, 101, 214);
            width: 200px;
            height: 200px;
            box-shadow: 50px;

        }
        #ul1 .li1{

            background-color: rgb(30, 255, 0);
            width: 170px;
            margin-top: 10px;
            height: 20px;
            padding: 10px;
            border-radius: 8px;

        }

            #ul1 .li2{

            background-color: rgb(0, 255, 64);
            width: 170px;
            margin-top: 10px;
            height: 20px;
            padding: 10px;
            border-radius: 8px;}

                #ul1 .li3{

            background-color: rgb(24, 255, 3);
            width: 170px;
            margin-top: 10px;
            height: 20px;
            padding: 10px;
            border-radius: 8px;}
    </style>
</head>
<body>
    

<h2 style="color: rgb(0, 86, 199);">unorder list</h2>
<ul id="ul1">

    <li class="li1">Apple</li>
    <li class="li2">Mango</li>
    <li class="li3">Banana</li>
</ul>


<h2 style="color: rgb(255, 153, 0);">order list</h2>
<ol id="ol1">

 <li>Apple</li>
    <li>Mango</li>
    <li>Banana</li>
    
</ol>





<h2>A Description List</h2>

<dl id="di1">
  <dt>Coffee</dt>
  <dd>- black hot drink</dd>
  <dt>Milk</dt>
  <dd>- white cold drink</dd>
  <dt>Shake</dt>
  <dd>kjhyunmsdf</dd>
</dl>


</body>
