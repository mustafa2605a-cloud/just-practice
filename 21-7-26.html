<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        #pare{
            display:flex;
            justify-content: center;
            height: 400px;
            width: 400px;
            background-color: bisque;
            border-radius: 10px;
            padding: 20px;
        }

        .chi1{
            display:flex;
            justify-content: center;
            height: 300px;
            width: 300px;
            background-color: rgb(255, 208, 0);
            border-radius: 10px;
            padding: 20px;
              transition: transform 0.3s ease;

        }

        
        .chi2{

                     display:flex;
            justify-content: center;
            height: 225px;
            width: 225px;
            background-color: rgb(6, 255, 19);
            border-radius: 10px;
            padding: 20px;
             transition: transform 0.3s ease;
        }

      
        .chi3{

                     display:flex;
            justify-content: center;
            height: 180px;
            width: 180px;
            background-color: rgb(0, 0, 0);
            border-radius: 10px;
            padding: 20px;
             transition: transform 0.3s ease;
        }
           
        .chi4{

                     display:flex;
            justify-content: center;
            height: 120px;
            width: 120px;
            background-color: rgb(6, 2, 231);
            border-radius: 10px;
            padding: 20px;
             transition: transform 0.3s ease;
        }
        #pare .chi1 :hover{
            background-color: rgb(13, 70, 109);
            cursor: pointer;
               transform: scale(1.2);
              
            

        }
          #pare .chi2 :hover{
            background-color: rgb(32, 206, 212);
                cursor: pointer;
                  transform: scale(1.2);

        }
          #pare .chi3 :hover{
            background-color: rgb(51, 33, 6);
                cursor: pointer;
                  transform: scale(1.2);

        }
          #pare .chi4 :hover{
            background-color: rgb(104, 13, 189);
                cursor: pointer;
                  transform: scale(1.2);

        }

    </style>
</head>
<body>

    <div id="pare"> 
        <div class="chi1">         <div class="chi2">  <div class="chi3">     <div class="chi4">child1</div></div></div></div>

        
      
    </div>
    
</body>
</html>
