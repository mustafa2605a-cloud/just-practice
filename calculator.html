<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            background-color: rgb(198, 201, 201);
            justify-content: center;
            display: flex;

        }


#div1{

    height: 550px;
    width: 400px;
    background-color: rgb(109, 108, 108);
    border-radius: 20px;
    box-shadow: 0px 4px 10px 2px solid black;
    border: 4px solid black;
    
}


    

#inp{
    margin-left: 50px;
    background-color: rgb(160, 157, 157);
    color: rgb(0, 0, 0);
    border-radius: 10px;
    height: 30px;
    width: 300px;
    border: 2px solid black;
    box-shadow: 0px 10px 14px 2px solid rgb(41, 41, 41);
}



button{
    height: 37px;
    width: 40px;
    margin-left: 70px;
    border: 2px solid black;
    background-color: rgb(177, 176, 176);
    border-radius: 5px;
    box-shadow: 0px 10px 14px 2px solid black;
    
}
button:hover{
    background-color: rgb(87, 87, 86);
    font-size: 30px;
    transition: 3sec;
}


    </style>

</head>
<body>

    <div id="div1">
        <h1 style="padding-left: 100px;">CALCULATOR</h1>

    <input  style="display: flex;" type="text" id="inp"><br><br>

 

<button onclick="calculator('1')">1</button><button onclick="calculator('2')">2</button><button onclick="calculator('3')">3</button><br><br>
<button onclick="calculator('4')">4</button><button onclick="calculator('5')">5</button><button onclick="calculator('6')">6</button><br><br>
<button onclick="calculator('7')">7</button><button onclick="calculator('8')">8</button><button onclick="calculator('9')">9</button><br><br>
<button onclick="calculator('+')">+</button><button onclick="calculator('-')">-</button><button onclick="calculator('0')">0</button><br><br>
<button onclick="calculator('/')">/</button><button onclick="calculator('*')">*</button><button onclick="clearing('')">AC</button><br><br>
<button onclick="finalvalue()">=</button>



</div>



<script>
       function calculator(number){

document.getElementById("inp").value+=number




       }


function clearing(){

    document.getElementById("inp").value=""
}


function finalvalue(){

final_result=document.getElementById("inp").value
document.getElementById("inp").value= eval(final_result)


}



</script>


    
</body>
</html>
