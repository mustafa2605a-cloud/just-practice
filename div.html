<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
   .container {
    width: 400px;
    height: 400px;
    background: peachpuff;
    display: flex;       /* Places children in a row */
    align-items: flex-start;
    gap: 10px;           /* Space between boxes */
    padding: 10px;
}

.yellow {
    width: 150px;
    height: 300px;
    background: gold;
}

.green {
    width: 100px;
    height: 200px;
    background: lime;
}

.black {
    width: 70px;
    height: 130px;
    background: black;
}

.blue {
    width: 50px;
    height: 80px;
    background: blue;
}
.container {
    position: relative;
    width: 400px;
    height: 400px;
    background: peachpuff;
}

.yellow {
    position: absolute;
    left: 10px;
    top: 10px;
}

.green {
    position: absolute;
    left: 180px;
    top: 10px;
}

.black {
    position: absolute;
    left: 290px;
    top: 10px;
}

.blue {
    position: absolute;
    left: 360px;
    top: 10px;
}


        
    </style>
</head>
<body>
  
    <div class="container">
    <div class="yellow">yellow</div>
    <div class="green">green</div>
    <div class="black">black</div>
    <div class="blue">blue</div>
</div>

</body>
</html>
